[package]
name = "backend"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
# Same as "backend", but generate and host OpenApi documents for generating automation test
name = "openapi_docs"
path = "src/docs_openapi.rs"

[lints]
workspace = true

[dependencies]
actix-web = { version = "4.18.1" }
actix-web-validator = { version = "7.0" }
argon2 = { version = "0.5", features = ["std"] }
uuid = { version = "1.29.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
env_logger = { version = "0.11.11" }
log = { version = "0.4.34" }
strum_macros = { version = "0.28.0" }
strum = { version = "0.28.0", features = ["derive"] }
derive_more = { version = "2.1.1" }
validator = { version = "0.20.0", features = ["derive"] }
regex = "1.13.1"
utoipa = { version = "6.0.0", features = ["actix_extras"] }
utoipa-axum = { version = "0.3.0" }
utoipa-swagger-ui = { version = "10", features = ["axum"] }

openssl = { version = "0.10.41" }
postgres-openssl = { version = "0.5.0" }
chrono = { version = "0.4.22" }
tokio-postgres = { version = "0.7.18" }
tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.8.9" }
tracing-subscriber = { version = "0.3.23" }
tracing = { version = "0.1.44" }

[dependencies.postgres]
version = "0.19.3"
features = [
    "with-uuid-1"
]
