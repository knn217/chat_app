[package]
name = "backend"
edition.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "backend"
path = "src/main.rs"

[[bin]]
# Same as "backend", but generate and host OpenApi documents for generating automation test
name = "openapi_docs"
path = "src/docs_openapi.rs"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8.9" }
argon2 = { version = "0.5", features = ["std"] }
uuid = { version = "1.29.0", features = ["v4"] }
serde = { version = "1.0.229", features = ["derive"] }
validator = { version = "0.20.0", features = ["derive"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "debug"] }
utoipa-axum = { version = "0.3.0" }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
openssl = { version = "0.10.41" }
postgres-openssl = { version = "0.5.0" }
chrono = { version = "0.4.22" }
tokio-postgres = { version = "0.7.18" }
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23" }
tracing = { version = "0.1.44" }

[dependencies.postgres]
version = "0.19.3"
features = [
    "with-uuid-1"
]
