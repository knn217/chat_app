name: CockroachDB Distributed Cluster

on:
  workflow_dispatch:
    inputs:
      keep_vms:
        description: Skip VM cleanup before the GitHub runner is destroyed (debugging only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  distributed-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      COCKROACH_IMAGE: cockroachdb/cockroach:v26.2.2
      SCRIPTS: .github/scripts
      # Makes the scripts call `sudo multipass` (root-owned snap on the runner).
      MULTIPASS_SUDO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use root consistently for all Multipass commands.
      - name: Install Multipass
        run: |
          sudo snap install multipass

          CERT=/var/snap/multipass/common/data/multipassd/multipass_root_cert.pem

          echo "Waiting for Multipass initialization..."
          for i in $(seq 1 60); do
            if sudo test -s "$CERT"; then
              break
            fi
            sleep 5
          done

          if ! sudo test -s "$CERT"; then
            echo "Multipass root certificate was not generated."
            sudo snap services multipass || true
            sudo journalctl --unit 'snap.multipass*' -n 200 --no-pager || true
            exit 1
          fi

          sudo multipass wait-ready
          sudo multipass version

          if [[ ! -e /dev/kvm ]]; then
            echo "Warning: /dev/kvm is unavailable; Multipass may run without hardware acceleration."
          fi

      # Outputs: NODE1_IP, NODE2_IP, NODE3_IP, LB_IP (plus *_NAME, *_STATE, ...).
      - name: Launch Ubuntu guests
        id: guests
        shell: bash
        run: |
          set -Eeuo pipefail
          for node in node1 node2 node3 lb; do
            bash "$SCRIPTS/multipass-launch.sh" "db-$node" \
              --prefix "$node" \
              --cpus 1 --memory 2G --disk 6G --timeout 900 \
              >> "$GITHUB_OUTPUT"
          done

      - name: Generate certificates and deployment package
        env:
          NODE1_IP: ${{ steps.guests.outputs.NODE1_IP }}
          NODE2_IP: ${{ steps.guests.outputs.NODE2_IP }}
          NODE3_IP: ${{ steps.guests.outputs.NODE3_IP }}
          LB_IP: ${{ steps.guests.outputs.LB_IP }}
        run: |
          set -Eeuo pipefail

          echo "=== Generate certificates ==="
          bash database/scripts/generate-ca.sh "./database"

          bash database/scripts/generate-cert-node.sh "./database" node1 node1 "$NODE1_IP" "$LB_IP"
          bash database/scripts/generate-cert-node.sh "./database" node2 node2 "$NODE2_IP" "$LB_IP"
          bash database/scripts/generate-cert-node.sh "./database" node3 node3 "$NODE3_IP" "$LB_IP"

          bash database/scripts/generate-cert-client.sh "./database" root
          bash database/scripts/generate-cert-client.sh "./database" user_be

          echo "=== Verify SAN for the nodes' certificates ==="
          for node in node1 node2 node3; do
            echo "=== $node ==="
            openssl x509 \
              -in "database/certs/$node/node.crt" \
              -noout -ext subjectAltName
          done

          echo "=== Package deployment files ==="
          mkdir -p "$RUNNER_TEMP/package"
          bash database/scripts/package.sh "$RUNNER_TEMP/package"

          echo "PACKAGE_CRDB=$RUNNER_TEMP/package/cockroach-cluster-package.tar.gz" \
            >> "$GITHUB_ENV"

      - name: Deploy one CockroachDB node per guest
        env:
          NODE1_IP: ${{ steps.guests.outputs.NODE1_IP }}
          NODE2_IP: ${{ steps.guests.outputs.NODE2_IP }}
          NODE3_IP: ${{ steps.guests.outputs.NODE3_IP }}
        shell: bash
        run: |
          set -Eeuo pipefail

          SQL_PORT=26257
          HTTP_PORT=8080
          JOIN_ADDRS="$NODE1_IP:$SQL_PORT,$NODE2_IP:$SQL_PORT,$NODE3_IP:$SQL_PORT"

          deploy_node() {
            local vm="$1" node="$2" ip="$3"

            echo "=== Deploying $node ($ip) ==="

            # Shared deployment package, plus this node's own certificates.
            bash "$SCRIPTS/multipass-send.sh" "$vm" "$PACKAGE_CRDB" /opt/crdb-deploy
            bash "$SCRIPTS/multipass-send.sh" "$vm" "database/certs/$node" /opt/crdb-deploy/node-certs

            sudo multipass exec "$vm" -- \
              sudo bash -s -- \
              "$node" "$ip" "$COCKROACH_IMAGE" "$JOIN_ADDRS" "$SQL_PORT" "$HTTP_PORT" \
              < "$SCRIPTS/compose_db_cloud.sh"
          }

          deploy_node db-node1 node1 "$NODE1_IP"
          deploy_node db-node2 node2 "$NODE2_IP"
          deploy_node db-node3 node3 "$NODE3_IP"

      - name: Initialize CockroachDB cluster
        env:
          NODE1_IP: ${{ steps.guests.outputs.NODE1_IP }}
        run: |
          set -Eeuo pipefail

          echo "=== Send temporary root client certificate ==="
          bash "$SCRIPTS/multipass-send.sh" db-node1 database/certs/root /tmp/crdb-client/root
          sudo multipass exec db-node1 -- sudo ls -R /tmp/crdb-client

          echo "=== Initialize cluster ==="
          initialized=false

          for attempt in $(seq 1 60); do
            if output=$(sudo multipass exec db-node1 -- sudo docker run --rm \
              --network host \
              -v /tmp/crdb-client/root:/cockroach/certs:ro \
              "$COCKROACH_IMAGE" \
              init \
              --certs-dir=/cockroach/certs \
              --host="$NODE1_IP:26257" 2>&1); then
              echo "$output"
              initialized=true
              break
            fi

            echo "$output"

            if grep -qi "cluster has already been initialized" <<< "$output"; then
              echo "Cluster is already initialized."
              initialized=true
              break
            fi

            echo "Initialization attempt $attempt failed; retrying..."
            sleep 5
          done

          if [[ "$initialized" != true ]]; then
            echo "Cluster initialization failed." >&2
            exit 1
          fi

      - name: Verify all three CockroachDB nodes
        env:
          NODE1_IP: ${{ steps.guests.outputs.NODE1_IP }}
          NODE2_IP: ${{ steps.guests.outputs.NODE2_IP }}
          NODE3_IP: ${{ steps.guests.outputs.NODE3_IP }}
        run: |
          set -Eeuo pipefail

          echo "=== Waiting for all three nodes to join the cluster ==="
          verified=false

          for attempt in $(seq 1 60); do
            if status=$(sudo multipass exec db-node1 -- sudo docker run --rm \
              --network host \
              -v /tmp/crdb-client/root:/cockroach/certs:ro \
              "$COCKROACH_IMAGE" \
              node status \
              --certs-dir=/cockroach/certs \
              --host="$NODE1_IP:26257" 2>&1); then
              echo "$status"

              if grep -Fq "$NODE1_IP:26257" <<< "$status" &&
                 grep -Fq "$NODE2_IP:26257" <<< "$status" &&
                 grep -Fq "$NODE3_IP:26257" <<< "$status"; then
                verified=true
                break
              fi
            else
              echo "$status"
            fi

            echo "Not all three nodes are visible yet (attempt $attempt/60)."
            sleep 5
          done

          if [[ "$verified" != true ]]; then
            echo "Cluster verification failed: expected all three nodes." >&2
            exit 1
          fi

          echo "All three nodes are registered in the cluster."

      - name: Remove temporary client credentials
        if: always()
        run: |
          sudo multipass exec db-node1 -- sudo rm -rf /tmp/crdb-client || true

      # Installs HAProxy on db-lb, renders the config from the three node IPs,
      # validates it, starts it and checks the listener from inside and outside
      # the VM. Output: HAPROXY_ENDPOINT (ip:port), HAPROXY_IP, HAPROXY_PORT, ...
      - name: Configure and start HAProxy
        id: haproxy
        env:
          NODE1_IP: ${{ steps.guests.outputs.NODE1_IP }}
          NODE2_IP: ${{ steps.guests.outputs.NODE2_IP }}
          NODE3_IP: ${{ steps.guests.outputs.NODE3_IP }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash "$SCRIPTS/haproxy-setup.sh" db-lb \
            --prefix haproxy \
            "$NODE1_IP" "$NODE2_IP" "$NODE3_IP" \
            >> "$GITHUB_OUTPUT"

      - name: Perform migration on CockroachDB cluster
        env:
          COCKROACH_HOST: ${{ steps.haproxy.outputs.HAPROXY_ENDPOINT }}
        working-directory: database
        run: |
          bash scripts/install-flyway.sh

          echo "Migrating through HAProxy at $COCKROACH_HOST"
          bash scripts/migrate.sh

      - name: Test distributed CockroachDB cluster
        working-directory: database
        env:
          COCKROACH_HOST: ${{ steps.haproxy.outputs.HAPROXY_ENDPOINT }}
        run: |
          bash scripts/local-test.sh

      - name: Collect diagnostics
        if: always()
        run: |
          echo "========== HAProxy (db-lb) =========="
          sudo multipass exec db-lb -- \
            sudo systemctl status haproxy --no-pager || true
          sudo multipass exec db-lb -- \
            sudo journalctl -u haproxy -n 100 --no-pager || true

          for node in db-node1 db-node2 db-node3; do
            echo "========== $node =========="
            sudo multipass info "$node" || true

            sudo multipass exec "$node" -- \
              sudo docker ps -a || true

            sudo multipass exec "$node" -- \
              sudo docker logs "cockroach-${node#db-}" \
              --tail 100 || true
          done

      - name: Delete Multipass VMs
        if: ${{ always() && !inputs.keep_vms }}
        run: |
          sudo multipass delete --all || true
          sudo multipass purge || true
