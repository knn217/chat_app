name: CockroachDB Distributed Cluster

on:
  workflow_dispatch:
    inputs:
      node_count:
        description: Number of CockroachDB nodes (3 or more recommended)
        required: false
        type: number
        default: 3
      keep_vms:
        description: Skip VM cleanup before the GitHub runner is destroyed (debugging only)
        required: false
        type: boolean
        default: false

# Number of CockroachDB nodes to create. Set it from the "Run workflow" form,
# or change the fallback here.
env:
  NODE_COUNT: ${{ inputs.node_count || 3 }}

permissions:
  contents: read

jobs:
  distributed-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      COCKROACH_IMAGE: cockroachdb/cockroach:v26.2.2
      SQL_PORT: "26257"
      HTTP_PORT: "8080"
      SCRIPTS: .github/scripts
      # Makes the scripts call `sudo multipass` (root-owned snap on the runner).
      MULTIPASS_SUDO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          if ! [[ "$NODE_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "NODE_COUNT must be a positive integer, got: '$NODE_COUNT'" >&2
            exit 1
          fi
          if (( NODE_COUNT < 3 )); then
            echo "::warning::NODE_COUNT=$NODE_COUNT: the cluster will work, but ranges cannot be fully replicated (3 nodes needed for the default replication factor)."
          fi
          if (( NODE_COUNT > 5 )); then
            echo "::warning::NODE_COUNT=$NODE_COUNT: each node VM uses 2 GB RAM; a standard runner may run out of memory."
          fi
          echo "Creating $NODE_COUNT node(s)."

      # Everything that does not depend on VM IPs is prepared up front, so
      # a problem here fails fast, before any VM is launched.
      - name: Generate shared certificates and deployment package
        run: |
          set -Eeuo pipefail

          bash database/scripts/generate-ca.sh "./database"
          bash database/scripts/generate-cert-client.sh "./database" root
          bash database/scripts/generate-cert-client.sh "./database" user_be

          mkdir -p "$RUNNER_TEMP/package"
          bash database/scripts/package.sh "$RUNNER_TEMP/package"

          echo "PACKAGE_CRDB=$RUNNER_TEMP/package/cockroach-cluster-package.tar.gz" \
            >> "$GITHUB_ENV"

      # Use root consistently for all Multipass commands.
      - name: Install Multipass
        run: |
          sudo snap install multipass

          CERT=/var/snap/multipass/common/data/multipassd/multipass_root_cert.pem

          echo "Waiting for Multipass initialization..."
          for i in $(seq 1 60); do
            if sudo test -s "$CERT"; then
              break
            fi
            sleep 5
          done

          if ! sudo test -s "$CERT"; then
            echo "Multipass root certificate was not generated."
            sudo snap services multipass || true
            sudo journalctl --unit 'snap.multipass*' -n 200 --no-pager || true
            exit 1
          fi

          sudo multipass wait-ready
          sudo multipass version

          if [[ ! -e /dev/kvm ]]; then
            echo "Warning: /dev/kvm is unavailable; Multipass may run without hardware acceleration."
          fi

      # The load balancer VM is launched first because every node certificate
      # needs its IP. HAProxy itself is configured in a separate step below.
      # Outputs: LB_IP, NODE_IPS (comma-separated, in node order), and the
      # full handle of every VM (NODE1_IP, NODE1_STATE, ...).
      - name: Launch Ubuntu guests
        id: guests
        shell: bash
        run: |
          set -Eeuo pipefail

          # value_of "<KEY=VALUE lines>" KEY
          value_of() { grep -m1 "^$2=" <<< "$1" | cut -d= -f2-; }

          out=$(bash "$SCRIPTS/multipass-launch.sh" db-lb \
            --prefix lb --cpus 1 --memory 2G --disk 6G --timeout 900)
          echo "$out" >> "$GITHUB_OUTPUT"
          [[ -n "$(value_of "$out" LB_IP)" ]] || { echo "No IP for db-lb" >&2; exit 1; }

          ips=()
          for i in $(seq 1 "$NODE_COUNT"); do
            out=$(bash "$SCRIPTS/multipass-launch.sh" "db-node$i" \
              --prefix "node$i" --cpus 1 --memory 2G --disk 6G --timeout 900)
            echo "$out" >> "$GITHUB_OUTPUT"

            ip=$(value_of "$out" "NODE${i}_IP")
            [[ -n "$ip" ]] || { echo "No IP for db-node$i" >&2; exit 1; }
            ips+=("$ip")
          done

          echo "NODE_IPS=$(IFS=,; echo "${ips[*]}")" >> "$GITHUB_OUTPUT"

      # One loop: each node goes from certificate to running container.
      - name: Deploy CockroachDB nodes
        id: deploy
        env:
          NODE_IPS: ${{ steps.guests.outputs.NODE_IPS }}
          LB_IP: ${{ steps.guests.outputs.LB_IP }}
        shell: bash
        run: |
          set -Eeuo pipefail

          IFS=, read -ra IPS <<< "$NODE_IPS"
          if (( ${#IPS[@]} != NODE_COUNT )); then
            echo "Expected $NODE_COUNT node IPs, got ${#IPS[@]}: $NODE_IPS" >&2
            exit 1
          fi

          join=""
          for ip in "${IPS[@]}"; do
            join+="${join:+,}$ip:$SQL_PORT"
          done

          for i in $(seq 1 "$NODE_COUNT"); do
            bash "$SCRIPTS/cockroach-node-deploy.sh" \
              --vm "db-node$i" \
              --node "node$i" \
              --ip "${IPS[i-1]}" \
              --lb-ip "$LB_IP" \
              --join "$join" \
              --image "$COCKROACH_IMAGE" \
              --package "$PACKAGE_CRDB" \
              --db-dir ./database \
              --sql-port "$SQL_PORT" \
              --http-port "$HTTP_PORT" \
              --prefix "node${i}_deploy" \
              >> "$GITHUB_OUTPUT"
          done

      - name: Initialize CockroachDB cluster
        env:
          NODE_IPS: ${{ steps.guests.outputs.NODE_IPS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          IFS=, read -ra IPS <<< "$NODE_IPS"

          bash "$SCRIPTS/cockroach-init.sh" db-node1 \
            --ip "${IPS[0]}" \
            --image "$COCKROACH_IMAGE" \
            --certs-dir database/certs/root \
            --port "$SQL_PORT"

      - name: Verify all CockroachDB nodes
        env:
          NODE_IPS: ${{ steps.guests.outputs.NODE_IPS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          IFS=, read -ra IPS <<< "$NODE_IPS"

          bash "$SCRIPTS/cockroach-verify.sh" db-node1 \
            --image "$COCKROACH_IMAGE" \
            --certs-dir database/certs/root \
            --port "$SQL_PORT" \
            "${IPS[@]}"

      # Installs HAProxy on db-lb, renders the config from the node IPs,
      # validates it, starts it and checks the listener from inside and outside
      # the VM. Output: HAPROXY_ENDPOINT (ip:port), HAPROXY_IP, HAPROXY_PORT, ...
      - name: Configure and start HAProxy
        id: haproxy
        env:
          NODE_IPS: ${{ steps.guests.outputs.NODE_IPS }}
        shell: bash
        run: |
          set -Eeuo pipefail
          IFS=, read -ra IPS <<< "$NODE_IPS"

          bash "$SCRIPTS/haproxy-setup.sh" db-lb \
            --prefix haproxy \
            --listen-port "$SQL_PORT" \
            --backend-port "$SQL_PORT" \
            --health-port "$HTTP_PORT" \
            "${IPS[@]}" \
            >> "$GITHUB_OUTPUT"

      - name: Perform migration on CockroachDB cluster
        env:
          COCKROACH_HOST: ${{ steps.haproxy.outputs.HAPROXY_ENDPOINT }}
        working-directory: database
        run: |
          bash scripts/install-flyway.sh

          echo "Migrating through HAProxy at $COCKROACH_HOST"
          bash scripts/migrate.sh

      - name: Test distributed CockroachDB cluster
        working-directory: database
        env:
          COCKROACH_HOST: ${{ steps.haproxy.outputs.HAPROXY_ENDPOINT }}
        run: |
          bash scripts/local-test.sh

      - name: Collect diagnostics
        if: always()
        run: |
          echo "========== HAProxy (db-lb) =========="
          sudo multipass exec db-lb -- \
            sudo systemctl status haproxy --no-pager || true
          sudo multipass exec db-lb -- \
            sudo journalctl -u haproxy -n 100 --no-pager || true

          for i in $(seq 1 "$NODE_COUNT"); do
            node="db-node$i"
            echo "========== $node =========="
            sudo multipass info "$node" || true

            sudo multipass exec "$node" -- \
              sudo docker ps -a || true

            sudo multipass exec "$node" -- \
              sudo docker logs "cockroach-node$i" \
              --tail 100 || true
          done

      - name: Delete Multipass VMs
        if: ${{ always() && !inputs.keep_vms }}
        run: |
          sudo multipass delete --all || true
          sudo multipass purge || true