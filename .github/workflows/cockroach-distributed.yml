name: CockroachDB Distributed Cluster

on:
  workflow_dispatch:
    inputs:
      keep_vms:
        description: Skip VM cleanup before the GitHub runner is destroyed (debugging only)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  distributed-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      COCKROACH_IMAGE: cockroachdb/cockroach:v26.2.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use root consistently for all Multipass commands.
      - name: Install Multipass
        run: |
          sudo snap install multipass

          CERT=/var/snap/multipass/common/data/multipassd/multipass_root_cert.pem

          echo "Waiting for Multipass initialization..."

          for i in $(seq 1 60); do
            if sudo test -s "$CERT"; then
              break
            fi
            sleep 5
          done

          if ! sudo test -s "$CERT"; then
            echo "Multipass root certificate was not generated."
            sudo snap services multipass || true
            sudo journalctl --unit 'snap.multipass*' -n 200 --no-pager || true
            exit 1
          fi

          sudo multipass wait-ready
          sudo multipass version

          if [[ ! -e /dev/kvm ]]; then
            echo "Warning: /dev/kvm is unavailable; Multipass may run without hardware acceleration."
          fi

      - name: Launch Ubuntu guests
        id: guests
        shell: bash
        run: |
          set -Eeuo pipefail

          for node in db-node1 db-node2 db-node3 db-lb; do
            echo "Launching $node..."

            sudo multipass launch 24.04 \
              --name "$node" \
              --cpus 1 \
              --memory 2G \
              --disk 6G \
              --timeout 900
          done

          declare -A ips

          for node in db-node1 db-node2 db-node3 db-lb; do
            ip=$(sudo multipass exec "$node" -- hostname -I | awk '{print $1}')

            if [[ -z "$ip" ]]; then
              echo "Could not obtain IP for $node" >&2
              exit 1
            fi

            ips[$node]="$ip"
            echo "$node = $ip"
          done

          echo "node1_ip=${ips[db-node1]}" >> "$GITHUB_OUTPUT"
          echo "node2_ip=${ips[db-node2]}" >> "$GITHUB_OUTPUT"
          echo "node3_ip=${ips[db-node3]}" >> "$GITHUB_OUTPUT"
          echo "lb_ip=${ips[db-lb]}" >> "$GITHUB_OUTPUT"

      - name: Generate certificates and deployment package
        env:
          NODE1_IP: ${{ steps.guests.outputs.node1_ip }}
          NODE2_IP: ${{ steps.guests.outputs.node2_ip }}
          NODE3_IP: ${{ steps.guests.outputs.node3_ip }}
          LB_IP:    ${{ steps.guests.outputs.lb_ip }}
        run: |
          set -Eeuo pipefail

          echo "=== Generate certificates ==="
          bash database/scripts/generate-ca.sh "./database"
          bash database/scripts/generate-cert-node.sh "./database" node1 node1 "$NODE1_IP" "$LB_IP"
          bash database/scripts/generate-cert-node.sh "./database" node2 node2 "$NODE2_IP" "$LB_IP"
          bash database/scripts/generate-cert-node.sh "./database" node3 node3 "$NODE3_IP" "$LB_IP"
          bash database/scripts/generate-cert-client.sh "./database" root
          bash database/scripts/generate-cert-client.sh "./database" user_be

          echo "=== Verify SAN for the nodes' certificates ==="
          for node in node1 node2 node3; do
              echo "=== $node ==="
              openssl x509 \
                  -in "database/certs/$node/node.crt" \
                  -noout -ext subjectAltName
          done

          echo "=== Package deployment files ==="
          mkdir -p "$RUNNER_TEMP/package"
          bash database/scripts/package.sh "$RUNNER_TEMP/package"

          echo "PACKAGE=$RUNNER_TEMP/package/cockroach-cluster-package.tar.gz" \
            >> "$GITHUB_ENV"

      - name: Deploy one CockroachDB node per guest
        env:
          NODE1_IP: ${{ steps.guests.outputs.node1_ip }}
          NODE2_IP: ${{ steps.guests.outputs.node2_ip }}
          NODE3_IP: ${{ steps.guests.outputs.node3_ip }}
        shell: bash
        run: |
          set -Eeuo pipefail

          JOIN_ADDRS="$NODE1_IP:26257,$NODE2_IP:26257,$NODE3_IP:26257"

          deploy_node() {
            local vm="$1"
            local node="$2"
            local ip="$3"
            local bundle="$RUNNER_TEMP/$node"
            local host_crdb_SQL_port="26257"
            local host_crdb_HTTP_port="8080"

            echo "=== Preparing deployment for $node ($ip) ==="

            rm -rf "$bundle"
            mkdir -p "$bundle/node-certs"

            # All nodes share the same deployment package,
            # but each receives its own node certificate.
            cp "$PACKAGE" "$bundle/cockroach-cluster-package.tar.gz"
            cp -a "database/certs/$node/." "$bundle/node-certs/"

            tar -czf "$RUNNER_TEMP/$node.tar.gz" \
              -C "$bundle" .

            sudo multipass transfer \
              "$RUNNER_TEMP/$node.tar.gz" \
              "$vm:/home/ubuntu/deploy.tar.gz"

            sudo multipass exec "$vm" -- \
              sudo bash -s -- \
                "$node" \
                "$ip" \
                "$COCKROACH_IMAGE" \
                "$JOIN_ADDRS" \
                "$host_crdb_SQL_port" \
                "$host_crdb_HTTP_port" \
                < .github/scripts/compose_db_cloud.sh
          }

          deploy_node db-node1 node1 "$NODE1_IP"
          deploy_node db-node2 node2 "$NODE2_IP"
          deploy_node db-node3 node3 "$NODE3_IP"

      - name: Initialize CockroachDB cluster
        env:
          NODE1_IP: ${{ steps.guests.outputs.node1_ip }}
        run: |
          set -Eeuo pipefail

          echo "=== Prepare temporary root client certificate transfer ==="

          echo "Creating archive from:"
          ls -lR database/certs/root
          tar -czf "$RUNNER_TEMP/client-root-certs.tar.gz" \
            -C database/certs root

          sudo multipass transfer \
            "$RUNNER_TEMP/client-root-certs.tar.gz" \
            db-node1:/home/ubuntu/client-root-certs.tar.gz

          sudo multipass exec db-node1 -- sudo bash -lc '
            mkdir -p /tmp/crdb-client
            tar -xzf /home/ubuntu/client-root-certs.tar.gz \
              -C /tmp/crdb-client
            ls -R /tmp/crdb-client
          '

          echo "=== Initialize cluster ==="

          initialized=false

          for attempt in $(seq 1 60); do
            if output=$(sudo multipass exec db-node1 -- sudo docker run --rm \
              --network host \
              -v /tmp/crdb-client/root:/cockroach/certs:ro \
              "$COCKROACH_IMAGE" \
              init \
              --certs-dir=/cockroach/certs \
              --host="$NODE1_IP:26257" 2>&1); then

              echo "$output"
              initialized=true
              break
            fi

            echo "$output"

            if grep -qi "cluster has already been initialized" <<< "$output"; then
              echo "Cluster is already initialized."
              initialized=true
              break
            fi

            echo "Initialization attempt $attempt failed; retrying..."
            sleep 5
          done

          if [[ "$initialized" != true ]]; then
            echo "Cluster initialization failed." >&2
            exit 1
          fi

      - name: Verify all three CockroachDB nodes
        env:
          NODE1_IP: ${{ steps.guests.outputs.node1_ip }}
          NODE2_IP: ${{ steps.guests.outputs.node2_ip }}
          NODE3_IP: ${{ steps.guests.outputs.node3_ip }}
        run: |
          set -Eeuo pipefail

          echo "=== Waiting for all three nodes to join the cluster ==="

          verified=false

          for attempt in $(seq 1 60); do
            if status=$(sudo multipass exec db-node1 -- sudo docker run --rm \
              --network host \
              -v /tmp/crdb-client/root:/cockroach/certs:ro \
              "$COCKROACH_IMAGE" \
              node status \
              --certs-dir=/cockroach/certs \
              --host="$NODE1_IP:26257" 2>&1); then

              echo "$status"

              if grep -Fq "$NODE1_IP:26257" <<< "$status" &&
                 grep -Fq "$NODE2_IP:26257" <<< "$status" &&
                 grep -Fq "$NODE3_IP:26257" <<< "$status"; then

                verified=true
                break
              fi
            else
              echo "$status"
            fi

            echo "Not all three nodes are visible yet (attempt $attempt/60)."
            sleep 5
          done

          if [[ "$verified" != true ]]; then
            echo "Cluster verification failed: expected all three nodes." >&2
            exit 1
          fi

          echo "All three nodes are registered in the cluster."

      - name: Remove temporary client credentials
        if: always()
        run: |
          sudo multipass exec db-node1 -- sudo rm -rf \
            /tmp/crdb-client \
            /home/ubuntu/client-root-certs.tar.gz || true

      # Generate the HAProxy configuration using node1 as the
      # discovery endpoint. The generated config must contain
      # all three CockroachDB nodes.
      - name: Configure and start HAProxy
        env:
          NODE1_IP: ${{ steps.guests.outputs.node1_ip }}
          NODE2_IP: ${{ steps.guests.outputs.node2_ip }}
          NODE3_IP: ${{ steps.guests.outputs.node3_ip }}
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== Install HAProxy on db-lb ==="

          sudo multipass exec db-lb -- sudo apt-get update

          sudo multipass exec db-lb -- \
            sudo apt-get install -y haproxy

          echo "=== Generate HAProxy configuration ==="

          HAPROXY_DIR="$RUNNER_TEMP/haproxy"
          mkdir -p "$HAPROXY_DIR"

          docker run --rm \
            --network host \
            -v "$GITHUB_WORKSPACE/database/certs/root:/cockroach/certs:ro" \
            -v "$HAPROXY_DIR:/work" \
            -w /work \
            "$COCKROACH_IMAGE" \
            gen haproxy \
              --certs-dir=/cockroach/certs \
              --host="$NODE1_IP" \
              --port=26257

          CONFIG="$HAPROXY_DIR/haproxy.cfg"

          if [[ ! -s "$CONFIG" ]]; then
            echo "HAProxy configuration was not generated." >&2
            exit 1
          fi

          echo "=== Verify all three backends ==="

          for ip in "$NODE1_IP" "$NODE2_IP" "$NODE3_IP"; do
            grep -Fq "$ip:26257" "$CONFIG" || {
              echo "Missing backend: $ip:26257" >&2
              exit 1
            }
          done

          echo "=== Configure listener ==="

          # Listen on all interfaces of db-lb.
          sed -i \
            's|^[[:space:]]*bind[[:space:]]*:26257[[:space:]]*$|  bind *:26257|' \
            "$CONFIG"

          grep -Eq \
            '^[[:space:]]*bind[[:space:]]+\*:26257[[:space:]]*$' \
            "$CONFIG" || {
              echo "Could not configure HAProxy listener." >&2
              exit 1
            }

          echo "=== Transfer configuration ==="

          sudo multipass transfer \
            "$CONFIG" \
            db-lb:/home/ubuntu/haproxy.cfg

          sudo multipass exec db-lb -- sudo bash -lc '
            install -m 644 \
              /home/ubuntu/haproxy.cfg \
              /etc/haproxy/haproxy.cfg

            haproxy -c -f /etc/haproxy/haproxy.cfg

            systemctl restart haproxy
            systemctl is-active --quiet haproxy
          '

          echo "HAProxy started successfully on db-lb."

      - name: Verify HAProxy listener
        run: |
          set -Eeuo pipefail

          echo "=== Waiting for HAProxy listener ==="

          ready=false

          for attempt in $(seq 1 30); do
            if sudo multipass exec db-lb -- \
              timeout 2 bash -c '</dev/tcp/127.0.0.1/26257' \
              2>/dev/null; then
              ready=true
              break
            fi

            sleep 1
          done

          if [[ "$ready" != true ]]; then
            echo "HAProxy is not accepting connections." >&2

            sudo multipass exec db-lb -- \
              sudo systemctl status haproxy --no-pager || true

            sudo multipass exec db-lb -- \
              sudo journalctl -u haproxy -n 100 --no-pager || true

            exit 1
          fi

          echo "HAProxy is listening on db-lb."

      - name: Perform migration on CockroachDB cluster
        env:
          COCKROACH_HOST: ${{ steps.guests.outputs.lb_ip }}:26257
          COCKROACH_IMAGE: cockroachdb/cockroach:v26.2.2
        working-directory: database
        run: |
          bash scripts/install-flyway.sh
          echo "Migrating through HAProxy at $COCKROACH_HOST"
          bash scripts/migrate.sh

      - name: Test distributed CockroachDB cluster
        working-directory: database
        env:
          COCKROACH_HOST: ${{ steps.guests.outputs.lb_ip }}:26257
          COCKROACH_IMAGE: cockroachdb/cockroach:v26.2.2
        run: |
          bash scripts/local-test.sh

      - name: Collect diagnostics
        if: always()
        run: |
          echo "========== HAProxy =========="

          sudo systemctl status haproxy --no-pager || true
          sudo journalctl -u haproxy -n 100 --no-pager || true

          for node in db-node1 db-node2 db-node3; do
            echo "========== $node =========="

            sudo multipass info "$node" || true

            sudo multipass exec "$node" -- \
              sudo docker ps -a || true

            sudo multipass exec "$node" -- \
              sudo docker logs "cockroach-${node#db-}" \
              --tail 100 || true
          done

      - name: Delete Multipass VMs
        if: ${{ always() && !inputs.keep_vms }}
        run: |
          sudo multipass delete --all || true
          sudo multipass purge || true
