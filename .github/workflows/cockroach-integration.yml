name: CockroachDB Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cockroach-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-cluster:
    name: Secure local three-node cluster
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: crdb-ci
      COCKROACH_IMAGE: cockroachdb/cockroach:v26.2.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start and initialize secure cluster
        working-directory: database
        run: bash scripts/local-up.sh

      - name: Verify cluster and SQL read/write
        working-directory: database
        run: bash scripts/local-test.sh

      - name: Stop cluster and remove generated material
        if: always()
        working-directory: database
        run: bash scripts/local-down.sh
