name: chat-db

x-build: &build
  context: .
  args:
    COCKROACH_VERSION: ${COCKROACH_VERSION:?set COCKROACH_VERSION in .env}

services:
  # Single-node, secure (TLS + password auth) CockroachDB.
  cockroach:
    build: *build
    image: chat-db:local
    command: ["/chat-db/scripts/start-node.sh"]
    ports:
      # Localhost only. Do not publish on 0.0.0.0.
      - "127.0.0.1:${DB_PORT:-26257}:26257"
      # DB Console (optional, needs a SQL user with admin rights):
      # - "127.0.0.1:8080:8080"
    volumes:
      - crdb-data:/cockroach/cockroach-data
      - crdb-certs:/certs
    healthcheck:
      test: ["CMD", "/cockroach/cockroach", "sql", "--certs-dir=/certs", "--host=localhost:26257", "-e", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 60s
    restart: unless-stopped

  # One-shot, idempotent: creates database, app role, schema and grants.
  db-setup:
    build: *build
    image: chat-db:local
    command: ["/chat-db/scripts/setup.sh"]
    depends_on:
      cockroach:
        condition: service_healthy
    environment:
      APP_DB_NAME: ${APP_DB_NAME:-chat_db}
      APP_DB_USER: ${APP_DB_USER:-chat_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      COCKROACH_ORG: ${COCKROACH_ORG:-}
      COCKROACH_LICENSE: ${COCKROACH_LICENSE:-}
    volumes:
      - crdb-certs:/certs:ro
    restart: "no"

volumes:
  crdb-data:
  crdb-certs:
